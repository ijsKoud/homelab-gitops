apiVersion: apps/v1
kind: Deployment
metadata: { name: redis, namespace: documentation }
spec:
  selector: { matchLabels: { app: redis } }
  template:
    metadata: { labels: { app: redis } }
    spec:
      containers:
        - name: redis
          image: redis:8.10.3-alpine
          ports: [{ containerPort: 6379 }]
---
apiVersion: v1
kind: Service
metadata: { name: redis, namespace: documentation }
spec:
  selector: { app: redis }
  ports: [{ port: 6379 }]
