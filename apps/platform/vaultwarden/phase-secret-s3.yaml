apiVersion: secrets.phase.dev/v1alpha1
kind: PhaseSecret
metadata: { name: vaultwarden-s3-secret, namespace: platform }
spec:
  phaseApp: s3-backups
  phaseAppEnv: production
  phaseAppEnvPath: /
  phaseHost: https://phase.k3s.home.klrnbk.nl
  pollingInterval: 30
  authentication:
    serviceToken:
      serviceTokenSecretReference:
        secretName: phase-service-token
        secretNamespace: phase-system
  managedSecretReferences:
    - secretName: vaultwarden-s3-creds
      secretNamespace: platform
      secretType: Opaque
