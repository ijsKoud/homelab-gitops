apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata: { name: vaultwarden-db, namespace: platform }
spec:
  instances: 2
  storage: { size: 5Gi, storageClass: local-path }
  bootstrap:
    initdb: { database: vaultwarden, owner: vaultwarden }
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      enabled: true
      isWALArchiver: true
      parameters: { barmanObjectName: vaultwarden-s3 }
---
apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata: { name: vaultwarden-s3, namespace: platform }
spec:
  retentionPolicy: "30d"
  configuration:
    destinationPath: s3://cnpg-backups/vaultwarden
    endpointURL: http://192.168.2.104:3900
    s3Credentials:
      accessKeyId: { name: vaultwarden-s3-creds, key: ACCESS_KEY_ID }
      secretAccessKey: { name: vaultwarden-s3-creds, key: ACCESS_SECRET_KEY }
      region: { name: vaultwarden-s3-creds, key: REGION }
    wal: { compression: gzip }
---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata: { name: vaultwarden-db-nightly, namespace: platform }
spec:
  schedule: "0 0 3 * * *"
  cluster: { name: vaultwarden-db }
  method: plugin
  pluginConfiguration: { name: barman-cloud.cloudnative-pg.io }
