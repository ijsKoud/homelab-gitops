apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflared
  namespace: platform
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  replicas: 2
  selector: { matchLabels: { app: cloudflared } }
  template:
    metadata: { labels: { app: cloudflared } }
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector: { matchLabels: { app: cloudflared } }
      containers:
        - name: cloudflared
          image: cloudflare/cloudflared:2026.10.4
          args: [tunnel, --no-autoupdate, --metrics, 0.0.0.0:2000, run]
          env:
            - name: TUNNEL_TOKEN
              valueFrom: { secretKeyRef: { name: cloudflared-token, key: TUNNEL_TOKEN } }
            - name: TUNNEL_ID
              valueFrom: { secretKeyRef: { name: cloudflared-token, key: TUNNEL_ID } }
          livenessProbe:
            httpGet: { path: /ready, port: 2000 }
            failureThreshold: 1
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { memory: 256Mi }
