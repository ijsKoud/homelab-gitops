apiVersion: apps/v1
kind: Deployment
metadata: { name: valkey, namespace: platform }
spec:
  selector: { matchLabels: { app: valkey } }
  template:
    metadata: { labels: { app: valkey } }
    spec:
      containers:
        - name: valkey
          image: valkey/valkey:9.1.2-alpine
          ports: [{ containerPort: 6379 }]
---
apiVersion: v1
kind: Service
metadata: { name: valkey, namespace: platform }
spec:
  selector: { app: valkey }
  ports: [{ port: 6379 }]
