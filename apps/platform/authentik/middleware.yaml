apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata: { name: forward-auth, namespace: authentik }
spec:
  forwardAuth:
    address: http://authentik-server.platform.svc.cluster.local/outpost.goauthentik.io/auth/treaefik
    trustForwardHeader: true
    authResponseHeaders:
      - X-authentik-username
      - X-authentik-groups
      - X-authentik-email
