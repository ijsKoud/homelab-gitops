apiVersion: apps/v1
kind: Deployment
metadata: { name: hello, namespace: kotlin-monorepo-template }
spec:
  replicas: 1
  selector: { matchLabels: { app: hello } }
  template:
    metadata: { labels: { app: hello } }
    spec:
      containers:
        - name: hello
          image: ghcr.io/ijskoud/kotlin-monorepo-template-hello:0.1.0@sha256:75cdca558bafce6ec2f50d9d5ae8e0c02efd899774a840f529a7935522af8d70
          ports: [{ containerPort: 8080 }]
          startupProbe: # the JVM is slow to start on a Pi
            httpGet: { path: /actuator/health/liveness, port: 8080 }
            periodSeconds: 5
            failureThreshold: 36
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: 8080 }
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: 8080 }
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 512Mi }
---
apiVersion: v1
kind: Service
metadata: { name: hello, namespace: kotlin-monorepo-template }
spec:
  selector: { app: hello }
  ports: [{ port: 80, targetPort: 8080 }]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata: { name: hello, namespace: kotlin-monorepo-template }
spec:
  ingressClassName: traefik
  rules:
    - host: hello.kotlin-monorepo-template.k3s.home.klrnbk.nl
      http:
        paths:
          - path: /
            pathType: Prefix
            backend: { service: { name: hello, port: { number: 80 } } }
