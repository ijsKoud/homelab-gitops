apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: longhorn
  namespace: longhorn-system
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: authentik-forward-auth@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - host: longhorn.k3s.home.klrnbk.nl
      http:
        paths:
          - path: /
            pathType: Prefix
            backend: { service: { name: longhorn-frontend, port: { number: 80 } } }
