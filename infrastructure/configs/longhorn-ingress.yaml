apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata: { name: longhorn, namespace: longhorn-system }
spec:
  entryPoints: [websecure]
  routes:
    - kind: Rule
      match: Host(`longhorn.k3s.home.klrnbk.nl`)
      priority: 10
      middlewares:
        - name: forward-auth
      services:
        - name: longhorn-frontend
          port: 80
    # Authentik's login callback lands on the app's own hostname; send it to the embedded outpost
    - kind: Rule
      match: Host(`longhorn.k3s.home.klrnbk.nl`) && PathPrefix(`/outpost.goauthentik.io/`)
      priority: 15
      services:
        - name: authentik-server
          namespace: platform
          port: 80
  tls: {}
