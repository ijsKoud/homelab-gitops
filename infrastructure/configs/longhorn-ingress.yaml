apiVersion: networking.k8s.io/v1
kind: Ingress
metadata: { name: longhorn, namespace: longhorn-system }
spec:
  ingressClassName: traefik
  rules:
    - host: longhorn.k3s.home.klrnbk.nl
      http:
        paths:
          - path: /
            pathType: Prefix
            backend: { service: { name: longhorn-frontend, port: { number: 8000 } } }
