apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: longhorn
  namespace: argocd
  annotations: { argocd.argoproj.io/sync-wave: "-2" }
spec:
  project: default
  source:
    repoURL: https://charts.longhorn.io
    chart: longhorn
    targetRevision: 1.13.0
    helm:
      valuesObject:
        preUpgradeChecker: { jobEnabled: false } # its Helm hook job doesn't work under Argo CD
        persistence:
          defaultClass: false
          defaultClassReplicaCount: 2
        defaultSettings:
          defaultReplicaCount: 2
        defaultBackupStore:
          backupTarget: nfs://192.168.2.104:/volume1/k3s/longhorn-backups
  destination: { server: https://kubernetes.default.svc, namespace: longhorn-system }
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [CreateNamespace=true, ServerSideApply=true]
